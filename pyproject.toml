[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-hsd"
version = "0.1.0"
description = "Hate speech detection, word attribution and moderator feedback research prototype"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.11,<2",
    "scikit-learn==1.4.2",
    "joblib>=1.3,<2",
    "streamlit>=1.40,<2",
    "shap>=0.48,<0.50",
    "lime>=0.2.0.1,<0.3",
]

[project.optional-dependencies]
models = [
    "torch>=2.6",
    "transformers>=4.52,<5",
    "sentencepiece>=0.2",
    "Pillow>=10",
]

[project.scripts]
xai-hsd = "xai_hsd.cli:main"

[tool.setuptools.packages.find]
include = ["xai_hsd*"]
